# XcodeGen spec: on the Mac run `brew install xcodegen && xcodegen` in this
# folder to create CamStudio.xcodeproj, then open it in Xcode.
name: CamStudio
options:
  bundleIdPrefix: vn.camstudio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # pick your team in Xcode > Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  CamStudio:
    type: application
    platform: iOS
    sources:
      - path: CamStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.camstudio.phone
        TARGETED_DEVICE_FAMILY: "1,2"
        # Same Info.plist as the xtool build (xtool.yml); Xcode merges in the standard keys.
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
  CamStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CamStudioTests
      - path: CamStudio/Crypto.swift
    resources:
      - path: ../docs/protocol-vectors.json
schemes:
  CamStudio:
    build:
      targets:
        CamStudio: all
        CamStudioTests: [test]
    test:
      targets:
        - CamStudioTests
