# XcodeGen spec: on the Mac run `brew install xcodegen && xcodegen` in this
# folder to create CamStudio.xcodeproj, then open it in Xcode, or just run
# scripts/ios-run.sh (build, install and launch on the connected iPhone).
name: CamStudio
options:
  bundleIdPrefix: vn.camstudio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
# The signing team comes from Signing.local.xcconfig (not in git, see Signing.xcconfig): a team
# picked in Xcode would be lost the next time xcodegen regenerates the project.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"        # CFBundleShortVersionString, as the v0.1.0 release
    CURRENT_PROJECT_VERSION: "1"      # CFBundleVersion: an extension must have one, equal to the app's
targets:
  CamStudio:
    type: application
    platform: iOS
    sources:
      - path: CamStudio
      # App icon (scripts/make-icon-ios.swift). Outside CamStudio/ so the SwiftPM/xtool build
      # does not pick it up as a resource.
      - path: Resources/Assets.xcassets
    dependencies:
      - target: CamStudioScreen      # embedded in PlugIns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.camstudio.phone
        TARGETED_DEVICE_FAMILY: "1,2"
        # Same Info.plist as the xtool build (xtool.yml); Xcode merges in the standard keys.
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CamStudio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Screen sharing: a ReplayKit broadcast upload extension that serves the screen to the PC as a
  # second source (port 47322). Shares the protocol code with the app, not the camera code.
  CamStudioScreen:
    type: app-extension
    platform: iOS
    sources:
      - path: CamStudioScreen
      - path: CamStudio/Crypto.swift
      - path: CamStudio/Wire.swift
      - path: CamStudio/Store.swift
      - path: CamStudio/Session.swift
      - path: CamStudio/PhoneServer.swift
      - path: CamStudio/StreamSupport.swift
      - path: CamStudio/VideoEncoder.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.camstudio.phone.screen
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: CamStudioScreen/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CamStudioScreen/CamStudioScreen.entitlements
  CamStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CamStudioTests
      - path: CamStudio/Crypto.swift
      - path: ../docs/protocol-vectors.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Same CryptoTests on the Mac itself: no simulator, iPhone or signing team needed.
  #   xcodebuild test -scheme CryptoTestsMac -destination platform=macOS
  CamStudioTestsMac:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CamStudioTests
      - path: CamStudio/Crypto.swift
      - path: ../docs/protocol-vectors.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  CamStudio:
    build:
      targets:
        CamStudio: all
        CamStudioTests: [test]
    test:
      targets:
        - CamStudioTests
  CryptoTestsMac:
    build:
      targets:
        CamStudioTestsMac: [test]
    test:
      targets:
        - CamStudioTestsMac
